name: Build Windows Installer

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        run: npm run build:frontend

      - name: Prune backend deps for production
        run: npm run build:backend

      - name: Delete existing release if present
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Write-Host "Checking for existing release on tag $tag"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          try {
            $resp = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" -Headers $headers -ErrorAction Stop
            Write-Host "Found release ID $($resp.id) — deleting it"
            Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/$($resp.id)" -Method Delete -Headers $headers
            Write-Host "Release deleted successfully"
          } catch {
            Write-Host "No existing release found (or already deleted) — continuing"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows installer and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
